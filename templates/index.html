
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iris Flower Prediction</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f2f7ff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .container {
            width: 90%;
            max-width: 500px;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;
            color: #2457a6;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 14px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #bbb;
            border-radius: 8px;
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #2457a6;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 8px;
            background: #2457a6;
            color: white;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            background: #17427f;
        }

        .result {
            margin-top: 22px;
            padding: 15px;
            text-align: center;
            border-radius: 8px;
            background: #e7f7e7;
            color: #176b2c;
            font-size: 20px;
            font-weight: bold;
        }

        .error {
            margin-top: 22px;
            padding: 15px;
            text-align: center;
            border-radius: 8px;
            background: #ffe8e8;
            color: #b00020;
        }

        .example {
            margin-top: 20px;
            padding: 12px;
            background: #f5f5f5;
            border-radius: 8px;
            color: #555;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🌸 Iris Flower Prediction</h1>
    <p class="subtitle">Enter the flower measurements</p>

    <form action="/predict" method="POST">

        <label for="sepal_length">Sepal Length (cm)</label>
        <input
            type="number"
            step="any"
            id="sepal_length"
            name="sepal_length"
            placeholder="Example: 5.1"
            value="{{ values.sepal_length if values else '' }}"
            required
        >

        <label for="sepal_width">Sepal Width (cm)</label>
        <input
            type="number"
            step="any"
            id="sepal_width"
            name="sepal_width"
            placeholder="Example: 3.5"
            value="{{ values.sepal_width if values else '' }}"
            required
        >

        <label for="petal_length">Petal Length (cm)</label>
        <input
            type="number"
            step="any"
            id="petal_length"
            name="petal_length"
            placeholder="Example: 1.4"
            value="{{ values.petal_length if values else '' }}"
            required
        >

        <label for="petal_width">Petal Width (cm)</label>
        <input
            type="number"
            step="any"
            id="petal_width"
            name="petal_width"
            placeholder="Example: 0.2"
            value="{{ values.petal_width if values else '' }}"
            required
        >

        <button type="submit">Predict Iris Flower</button>
    </form>

    {% if prediction %}
        <div class="result">
            Prediction: {{ prediction }}
        </div>
    {% endif %}

    {% if error %}
        <div class="error">
            {{ error }}
        </div>
    {% endif %}

    <div class="example">
        <strong>Example:</strong> 5.1, 3.5, 1.4, 0.2 → Iris Setosa
    </div>

</div>

</body>
</html>
